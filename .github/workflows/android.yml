name: Build MedAtlas Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MedAtlas-Lenovo-AI-0.2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Optional stable signing for Classroom OAuth
        env:
          MEDATLAS_KEYSTORE_BASE64: ${{ secrets.MEDATLAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MEDATLAS_KEYSTORE_BASE64" ]; then
            printf '%s' "$MEDATLAS_KEYSTORE_BASE64" | base64 --decode > app/medatlas-signing.jks
          fi

      - name: Verify offline study catalog
        run: python3 tools/check_workbook.py

      - name: Build debug APK
        env:
          MEDATLAS_STORE_PASSWORD: ${{ secrets.MEDATLAS_STORE_PASSWORD }}
          MEDATLAS_KEY_ALIAS: ${{ secrets.MEDATLAS_KEY_ALIAS }}
          MEDATLAS_KEY_PASSWORD: ${{ secrets.MEDATLAS_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Classroom signing certificate
        run: |
          test -s app/medatlas-signing.jks || { echo "::error::MEDATLAS_KEYSTORE_BASE64 is missing. Configure the four signing secrets."; exit 1; }
          certificate_info=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$certificate_info"
          actual_sha1=$(printf '%s\n' "$certificate_info" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test "$actual_sha1" = "d09083802dc5722fd11538912f5787e8258b53b6" || { echo "::error::APK signing certificate does not match the SHA-1 registered for Classroom."; exit 1; }

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MedAtlas-Lenovo-debug-apk
          path: MedAtlas-Lenovo-AI-0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise patient workbook on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          working-directory: MedAtlas-Lenovo-AI-0.2
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
        env:
          MEDATLAS_STORE_PASSWORD: ${{ secrets.MEDATLAS_STORE_PASSWORD }}
          MEDATLAS_KEY_ALIAS: ${{ secrets.MEDATLAS_KEY_ALIAS }}
          MEDATLAS_KEY_PASSWORD: ${{ secrets.MEDATLAS_KEY_PASSWORD }}

      - name: Show Android test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for failure in case.findall("failure"):
                      print(case.get("name"), (failure.text or failure.get("message", ""))[:5000])
          PY
