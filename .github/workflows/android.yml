name: Build MedAtlas Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MedAtlas-Lenovo-AI-0.2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Optional stable signing for Classroom OAuth
        env:
          MEDATLAS_KEYSTORE_BASE64: ${{ secrets.MEDATLAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MEDATLAS_KEYSTORE_BASE64" ]; then
            printf '%s' "$MEDATLAS_KEYSTORE_BASE64" | base64 --decode > app/medatlas-signing.jks
          fi

      - name: Verify offline study catalog
        run: python3 tools/check_workbook.py

      - name: Build debug APK
        env:
          MEDATLAS_STORE_PASSWORD: ${{ secrets.MEDATLAS_STORE_PASSWORD }}
          MEDATLAS_KEY_ALIAS: ${{ secrets.MEDATLAS_KEY_ALIAS }}
          MEDATLAS_KEY_PASSWORD: ${{ secrets.MEDATLAS_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MedAtlas-Lenovo-debug-apk
          path: MedAtlas-Lenovo-AI-0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
