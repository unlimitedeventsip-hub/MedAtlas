name: MedAtlas cross-device source checks (NO APK)

on:
  push:
    branches:
      - main
      - feature/medatlas-cross-device-ocr-workspace
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: medatlas-source-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Compile source only — no APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MedAtlas-Lenovo-AI-0.2
    steps:
      - name: Checkout feature sources
        uses: actions/checkout@v4

      - name: Validate Companion JavaScript
        run: |
          node --check desktop/app.js
          node --check desktop/stroke-format.mjs
          node --check desktop/sw.js
          node --test desktop/tests/*.test.mjs
          python3 -m json.tool desktop/manifest.webmanifest > /dev/null
          test -s desktop/index.html
          test -s desktop/styles.css
          echo "Companion source syntax valid; no installable package created."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android app and instrumentation test sources only
        # Anatomical PNG/3D asset generation belongs to explicit APK packaging.
        # Source compilation does not need the large Python asset pipeline.
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin -x :app:prepareAnatomy

      - name: Assert no installable APK was generated
        run: |
          if find app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Source-only workflow must never generate APK files."
            exit 1
          fi
          echo "Confirmed: no APK built or uploaded."
